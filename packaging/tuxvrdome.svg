<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1630"/>
      <stop offset="1" stop-color="#1d3b5c"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fe0a0" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#3fe0a0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6fa8ff" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#sky)"/>
  <!-- the dome: an aurora arching over the headset -->
  <path d="M36 168 A 92 92 0 0 1 220 168" stroke="url(#aurora)" stroke-width="16"
        fill="none" stroke-linecap="round"/>
  <!-- headset -->
  <rect x="56" y="128" width="144" height="70" rx="30" fill="#f2f5fa"/>
  <circle cx="100" cy="163" r="17" fill="#1d3b5c"/>
  <circle cx="156" cy="163" r="17" fill="#1d3b5c"/>
  <path d="M120 198 q8 -14 16 0" fill="#1d3b5c"/>
</svg>
